name: fxbot-heartbeat
# runner(fxbot-daily)が止まっていないかを state.json の last_run で確認。
# 注意: GitHub のスケジュール自体が止まるとこのジョブも止まる → 外部 heartbeat(HEALTHCHECK_URL)を併用。
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fxbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m fxbot.heartbeat --max-age-hours 30
