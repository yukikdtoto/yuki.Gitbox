name: fxbot-tests
on:
  push:
    paths: ["fxbot/**", ".github/workflows/fxbot-*.yml"]
  pull_request:
    paths: ["fxbot/**", ".github/workflows/fxbot-*.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fxbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider
